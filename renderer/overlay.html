<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="crosshair.js"></script>
<script>
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let state = null;
  function render() {
    // Tamaño en píxeles físicos para que cada línea caiga exacta en el píxel central.
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; }
    ctx.clearRect(0, 0, w, h);
    if (!state) return;
    const cx = Math.floor(w / 2) + (state.offsetX || 0);
    const cy = Math.floor(h / 2) + (state.offsetY || 0);
    Crosshair.draw(ctx, state.crosshair, cx, cy, { redraw: render });
  }
  window.af.onOverlay((d) => { state = d; render(); });
  window.addEventListener('resize', render);
</script>
</body>
</html>
